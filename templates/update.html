{% extends "base.html" %}
{% block content %}

<div class="auth-container">
    <form method="POST" class="card">
        <h5>Edit Task</h5>
        <div class="form-group">
            <input name="title" value="{{ record.title }}" class="form-control" required>
        </div>
        <div class="form-group mb-4">
            <textarea name="description" class="form-control" required>{{ record.description }}</textarea>
        </div>
        <button class="btn btn-success w-100 mb-3">Save Changes</button>
        <a href="/" class="btn btn-secondary w-100">Cancel</a>
    </form>
</div>

{% endblock %}
