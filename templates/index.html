{% extends "base.html" %}
{% block content %}

<form method="POST" action="/add" class="card mb-4">
    <h5>Add New Task</h5>
    <div class="form-group">
        <input name="title" class="form-control" placeholder="Task Title" required>
    </div>
    <div class="form-group mb-4">
        <textarea name="description" class="form-control" placeholder="Task Description..." required></textarea>
    </div>
    <button class="btn btn-primary w-100">Add Task</button>
</form>

<div class="table-container">
    <table>
        <thead>
            <tr>
                <th>Title</th>
                <th>Description</th>
                <th width="160px">Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for record in records %}
            <tr>
                <td><strong>{{ record.title }}</strong></td>
                <td>{{ record.description }}</td>
                <td class="actions">
                    <a href="/update/{{ record.id }}" class="btn btn-warning btn-sm">Edit</a>
                    <a href="/delete/{{ record.id }}" class="btn btn-danger btn-sm"
                       onclick="return confirm('Delete this record?')">Delete</a>
                </td>
            </tr>
            {% else %}
            <tr>
                <td colspan="3">
                    <div class="empty-state">
                        <p>No tasks found. Add your first task above!</p>
                    </div>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

{% endblock %}
